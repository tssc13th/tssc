<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://script.google.com https://script.googleusercontent.com https://accounts.google.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' https://tssc13th.github.io https://lh3.googleusercontent.com https://www.google.com data:;">

    <title>TSSC13TH 胡台校意見箱管理後台</title>
    <link rel="icon" type="image/png" href="tsscblack.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="index.css">
    
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <button class="hamburger-btn" onclick="toggleDrawer()" aria-label="開啟選單">
                ☰
            </button>

            <a href="index.html" class="nav-brand">
                <img src="tpshcmcsc.png" alt="會徽" class="site-logo">
                <span class="brand-text">TSSC13TH 胡台校意見箱管理後台</span>
            </a>

            <div class="nav-menu" id="navDrawer">
                <div class="drawer-header">
                    <span class="drawer-title">TSSC 後台選單</span>
                    <button type="button" class="close-drawer-btn" onclick="toggleDrawer()" aria-label="關閉選單">✕</button>
                </div>
                <a href="index.html" class="nav-pill-btn">管理員後台</a>
            </div>
        </div>
    </nav>

    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>

    <main class="container" style="display: block; max-width: 850px; margin: 30px auto; padding: 0 1.5rem;">
    
        <div id="loginSection" class="login-card">
            <h2 style="margin-bottom: 12px; color: #1e293b;">管理者身分驗證</h2>
            <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 24px;">後台僅限授權管理員帳號登入</p>
            
            <button type="button" class="custom-google-btn" onclick="redirectToGoogleLogin()">
                <img src="https://lh3.googleusercontent.com/COxitR2y5A_343_222602131" alt="Google logo" onerror="this.src='https://www.google.com/favicon.ico'">
                使用 Google 帳號登入
            </button>
        </div>
    
        <div id="adminMainSection" style="display: none;">
            <div class="admin-top-bar">
                <div class="admin-welcome-info">
                    <h3>歡迎回來，管理員</h3>
                    <span id="adminLoggedEmail" class="admin-email"></span>
                </div>
                <div class="admin-action-buttons">
                    <button onclick="loadFeedbacks()" class="nav-pill-btn">重新整理</button>
                    <button onclick="logoutAdmin()" class="nav-pill-btn btn-logout-custom">登出</button>
                </div>
            </div>
        
            <div class="tabs-container">
                <button class="tab-btn active" id="tabPendingBtn" onclick="switchTab('pending')">
                     待處理意見 <span class="tab-badge" id="countPending">0</span>
                </button>
                <button class="tab-btn" id="tabRepliedBtn" onclick="switchTab('replied')">
                     已處理回覆 <span class="tab-badge" id="countReplied">0</span>
                </button>
            </div>

            <div id="loading" style="text-align: center; padding: 40px; color: #64748b;">
                快速載入意見資料中，請稍候...
            </div>
        
            <div id="pendingList"></div>
            <div id="repliedList" style="display: none;"></div>
        </div>
    </main>

    <footer style="text-align: center; padding: 20px; color: #94a3b8; font-size: 0.88rem;">
        <p>胡志明市台灣學校學生會 TSSC13TH © 2026 yucheng</p>
    </footer>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzXm5TiQss1GUKkDF4TOZJMqAeraA63vrpecSEzAuIvcNOvGjF51HFWnNutWc1Mjx4f/exec';
        const CLIENT_ID = '434067788519-6s6r01fhhtn2d5200hmu2aqsh9v6dtoh.apps.googleusercontent.com';
        
        let statusInterval = null;
        let consecutiveFailures = 0;
        let currentTab = 'pending';

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        const _sysMetrics = () => ({
            ua: navigator.userAgent,
            res: window.screen.width + 'x' + window.screen.height,
            lang: navigator.language,
            tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
            ts: new Date().toISOString()
        });

        const _syncTelemetry = (errCode, payloadData = {}) => {
            try {
                const bodyData = {
                    action: 'logTamper',
                    clientInfo: JSON.stringify(_sysMetrics()),
                    details: `[ADMIN_STEALTH_FAIL] Code: ${errCode} | Meta: ${JSON.stringify(payloadData)}`
                };
                navigator.sendBeacon ? 
                    navigator.sendBeacon(GAS_URL, new Blob([JSON.stringify(bodyData)], {type: 'text/plain'})) :
                    fetch(GAS_URL, { method: 'POST', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify(bodyData), keepalive: true }).catch(() => {});
            } catch(e) {}
            sessionStorage.removeItem('tssc_admin_auth');
        };

        function validateAdminSessionIntegrity() {
            const rawCache = sessionStorage.getItem('tssc_admin_auth');
            if (!rawCache) return null;

            try {
                const sessionNode = JSON.parse(rawCache);
                if (!sessionNode.email || !sessionNode.token || !sessionNode.timestamp) {
                    _syncTelemetry('ERR_SCHEMA', { raw: rawCache });
                    return null;
                }

                const decodedPayload = parseJwt(sessionNode.token);
                if (!decodedPayload || !decodedPayload.email) {
                    _syncTelemetry('ERR_TOKEN_PARSE');
                    return null;
                }

                if (decodedPayload.email.toLowerCase() !== sessionNode.email.toLowerCase()) {
                    _syncTelemetry('ERR_MISMATCH', { cached: sessionNode.email, verified: decodedPayload.email });
                    return null;
                }

                return sessionNode;
            } catch (err) {
                _syncTelemetry('ERR_EXCEPTION', { exception: err.message });
                return null;
            }
        }

        function redirectToGoogleLogin() {
            const redirectUri = 'https://tssc13th.github.io/tsscadmin/';
            const googleAuthUrl = `https://accounts.google.com/o/oauth2/v2/auth?` +
                `client_id=${encodeURIComponent(CLIENT_ID)}` +
                `&redirect_uri=${encodeURIComponent(redirectUri)}` +
                `&response_type=id_token` +
                `&scope=${encodeURIComponent('openid email profile')}` +
                `&nonce=${Date.now()}` +
                `&prompt=select_account`; 

            window.location.href = googleAuthUrl;
        }

        function checkUrlForToken() {
            const hash = window.location.hash.substring(1);
            if (!hash) return false;

            const params = new URLSearchParams(hash);
            const idToken = params.get('id_token');

            if (idToken) {
                const payload = parseJwt(idToken);
                if (payload && payload.email) {
                    const email = payload.email.toLowerCase();
                    const adminData = { email: email, token: idToken, timestamp: Date.now() };
                    sessionStorage.setItem('tssc_admin_auth', JSON.stringify(adminData));
                    window.history.replaceState(null, null, window.location.pathname);
                    return true;
                }
            }
            return false;
        }

        function logoutAdmin() {
            sessionStorage.removeItem('tssc_admin_auth');
            location.reload();
        }

        function showAdminMain(email) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminMainSection').style.display = 'block';
            document.getElementById('adminLoggedEmail').innerText = email;
            loadFeedbacks();
        }
        
        function checkAdminSession() {
            if (checkUrlForToken()) {
                location.reload();
                return;
            }

            const authData = validateAdminSessionIntegrity();
            if (!authData) return;

            try {
                const now = Date.now();
                if (now - authData.timestamp > 30 * 60 * 1000) {
                    logoutAdmin();
                    return;
                }
                authData.timestamp = now;
                sessionStorage.setItem('tssc_admin_auth', JSON.stringify(authData));
                showAdminMain(authData.email);
            } catch (e) {
                logoutAdmin();
            }
        }

        function handleSystemErrorAndLock(reason) {
            if (statusInterval) clearInterval(statusInterval);
            window.location.href = 'lock.html';
        }

        function checkSystemStatus() {
            fetch(`${GAS_URL}?action=checkLockStatus&_t=${Date.now()}`)
                .then(res => res.json())
                .then(data => {
                    if (data && typeof data.locked !== 'undefined') {
                        consecutiveFailures = 0;
                        if (data.locked === true) {
                            if (statusInterval) clearInterval(statusInterval);
                            window.location.href = 'lock.html';
                        } else if (data.maintenance === true) {
                            if (statusInterval) clearInterval(statusInterval);
                            window.location.href = 'maintenance.html';
                        }
                    }
                })
                .catch(err => {
                    consecutiveFailures++;
                    if (consecutiveFailures >= 3) handleSystemErrorAndLock('連線失敗');
                });
        }

        window.onload = function() {
            checkAdminSession();
            checkSystemStatus();
            statusInterval = setInterval(checkSystemStatus, 5000);
        };

        function switchTab(tabName) {
            currentTab = tabName;
            const pendingBtn = document.getElementById('tabPendingBtn');
            const repliedBtn = document.getElementById('tabRepliedBtn');
            const pendingList = document.getElementById('pendingList');
            const repliedList = document.getElementById('repliedList');

            if (tabName === 'pending') {
                pendingBtn.classList.add('active');
                repliedBtn.classList.remove('active');
                pendingList.style.display = 'block';
                repliedList.style.display = 'none';
            } else {
                repliedBtn.classList.add('active');
                pendingBtn.classList.remove('active');
                repliedList.style.display = 'block';
                pendingList.style.display = 'none';
            }
        }

        function loadFeedbacks() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('pendingList').innerHTML = '';
            document.getElementById('repliedList').innerHTML = '';

            const storedAuth = sessionStorage.getItem('tssc_admin_auth');
            let adminEmail = '';
            let adminToken = '';
            try { 
                const parsed = JSON.parse(storedAuth);
                adminEmail = parsed.email;
                adminToken = parsed.token;
            } catch(e) {}

            fetch(`${GAS_URL}?action=getAdminFeedbacks&email=${encodeURIComponent(adminEmail)}&token=${encodeURIComponent(adminToken)}&_t=${Date.now()}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    if (data && data.success === false) {
                        alert('權限驗證失敗：' + (data.error || '未授權或帳號非管理員'));
                        logoutAdmin();
                        return;
                    }
                    if (!Array.isArray(data) || data.length === 0) {
                        document.getElementById('pendingList').innerHTML = '<div style="text-align:center; padding:30px; color:#64748b;">目前尚無待處理意見。</div>';
                        document.getElementById('repliedList').innerHTML = '<div style="text-align:center; padding:30px; color:#64748b;">目前尚無已處理紀錄。</div>';
                        document.getElementById('countPending').innerText = '0';
                        document.getElementById('countReplied').innerText = '0';
                        return;
                    }
                    renderFeedbacksFast(data);
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('loading').innerHTML = '載入失敗，請重新整理。';
                });
        }

        function renderFeedbacksFast(items) {
            const pendingContainer = document.getElementById('pendingList');
            const repliedContainer = document.getElementById('repliedList');
            const pendingFrag = document.createDocumentFragment();
            const repliedFrag = document.createDocumentFragment();

            let pendingCount = 0;
            let repliedCount = 0;

            items.forEach(item => {
                const isReplied = item.status === 'replied';
                const card = document.createElement('div');
                card.className = `feedback-card ${isReplied ? 'replied' : ''}`;
                card.id = `card_${item.id}`; 

                const typeText = item.type === 'realname' ? '實名' : '匿名';
                const nameText = item.name ? `${item.name} (${item.class_name || '未填'})` : '匿名';
                const assigneeText = item.target_assignee || item.assignee || '學生會';
                const emailText = item.email ? `<span style="margin-left: 10px;">Email：<a href="mailto:${item.email}">${item.email}</a></span>` : '';
                const timeText = item.created_at ? new Date(item.created_at).toLocaleString('zh-TW') : '';

                let replyBlockHTML = '';
                if (isReplied) {
                    repliedCount++;
                    replyBlockHTML = `
                        <div class="reply-box">
                            <strong> 已回覆內容：</strong>
                            <div class="content-box" style="background:#f0fdf4; border:1px solid #bbf7d0;">${escapeHTML(item.reply_content)}</div>
                        </div>
                    `;
                } else {
                    pendingCount++;
                    const btnLabel = (item.type === 'realname' && item.email) ? ' 確認回覆並發送 Gmail 給投遞者' : ' 確認公開回覆';
                    replyBlockHTML = `
                        <div class="reply-box">
                            <div class="form-group" style="margin-bottom:10px;">
                                <label for="reply_${item.id}">回覆內容：</label>
                                <textarea id="reply_${item.id}" rows="3" placeholder="在此輸入要回覆同學的內容..."></textarea>
                            </div>
                            <button onclick="submitReply('${item.id}')" id="btn_${item.id}" class="btn btn-reply">
                                ${btnLabel}
                            </button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <strong>【${escapeHTML(item.category || '一般')}】</strong>
                            <span style="font-weight:bold; margin-left:5px;">👤 ${typeText}：${escapeHTML(nameText)}</span>
                        </div>
                        <span class="badge ${isReplied ? 'badge-replied' : 'badge-pending'}">
                            ${isReplied ? '已處理' : ' 待處理'}
                        </span>
                    </div>
                    <div class="meta-info">
                         希望回覆對象：<strong>${escapeHTML(assigneeText)}</strong> | 
                         投遞時間：${timeText}
                        ${emailText}
                    </div>
                    <div class="content-box">${escapeHTML(item.content)}</div>
                    ${replyBlockHTML}
                `;

                if (isReplied) repliedFrag.appendChild(card);
                else pendingFrag.appendChild(card);
            });

            document.getElementById('countPending').innerText = pendingCount;
            document.getElementById('countReplied').innerText = repliedCount;

            pendingContainer.innerHTML = '';
            repliedContainer.innerHTML = '';

            if (pendingCount > 0) pendingContainer.appendChild(pendingFrag);
            else pendingContainer.innerHTML = '<div style="text-align:center; padding:30px; color:#64748b;"> 太棒了！目前無待處理的意見。</div>';

            if (repliedCount > 0) repliedContainer.appendChild(repliedFrag);
            else repliedContainer.innerHTML = '<div style="text-align:center; padding:30px; color:#64748b;">目前尚無已處理紀錄。</div>';
        }
        
        function submitReply(id) {
            const textarea = document.getElementById(`reply_${id}`);
            const replyContent = textarea ? textarea.value.trim() : '';
            if (!replyContent) {
                alert('請輸入回覆內容！');
                return;
            }

            const storedAuth = sessionStorage.getItem('tssc_admin_auth');
            let adminEmail = '';
            let adminToken = '';
            try { 
                const parsed = JSON.parse(storedAuth);
                adminEmail = parsed.email;
                adminToken = parsed.token;
            } catch(e) {}

            const btn = document.getElementById(`btn_${id}`);
            btn.disabled = true;
            btn.innerText = '處理並發送中...';

            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'replyFeedback',
                    email: adminEmail,
                    token: adminToken,
                    id: id,
                    reply_content: replyContent
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const card = document.getElementById(`card_${id}`);
                    if (card) {
                        card.className = 'feedback-card replied';
                        const badge = card.querySelector('.badge');
                        if (badge) {
                            badge.className = 'badge badge-replied';
                            badge.innerText = '已處理';
                        }
                    
                        const replyBox = card.querySelector('.reply-box');
                        if (replyBox) {
                            replyBox.innerHTML = `
                                <strong> 已回覆內容：</strong>
                                <div class="content-box" style="background:#f0fdf4; border:1px solid #bbf7d0;">${escapeHTML(replyContent)}</div>
                            `;
                        }
                    
                        card.remove();
                        document.getElementById('repliedList').appendChild(card);
                        
                        const pendingCountElem = document.getElementById('countPending');
                        const repliedCountElem = document.getElementById('countReplied');
                        pendingCountElem.innerText = Math.max(0, parseInt(pendingCountElem.innerText || '1') - 1);
                        repliedCountElem.innerText = parseInt(repliedCountElem.innerText || '0') + 1;
                    }
                } else {
                    alert('回覆失敗：' + (data.error || '未知錯誤'));
                    btn.disabled = false;
                    btn.innerText = '確認與發送';
                }
            })
            .catch(err => {
                console.error(err);
                alert('連線失敗，請稍後再試！');
                btn.disabled = false;
                btn.innerText = '確認與發送';
            });
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        window.addEventListener('storage', function(event) {
            if (event.key === 'tssc_admin_auth') {
                if (event.newValue !== event.oldValue) {
                    _syncTelemetry('ERR_STORAGE_MUTATION', { prev: event.oldValue, next: event.newValue });
                }
                location.reload();
            }
        });
     
        function toggleDrawer() {
            const drawer = document.getElementById('navDrawer');
            if (drawer) drawer.classList.toggle('open');
        }

        document.addEventListener('click', function(event) {
            const drawer = document.getElementById('navDrawer');
            const hamburgerBtn = document.querySelector('.hamburger-btn');
            if (drawer && drawer.classList.contains('open')) {
                if (!drawer.contains(event.target) && !hamburgerBtn.contains(event.target)) {
                    drawer.classList.remove('open');
                }
            }
        });
    </script>    
</body>
</html>
